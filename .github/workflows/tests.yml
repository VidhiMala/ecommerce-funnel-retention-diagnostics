name: tests

# Runs the test suite on every push and pull request.
# Raw data is not in the repository, so real-data tests (tests/test_data_quality.py)
# skip automatically; all logic is tested on synthetic fixtures.
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -rs
